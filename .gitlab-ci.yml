stages:
  - test
  - deploy

backend-unit-test:
  stage: test
  image: eclipse-temurin:17-jdk
  tags:
    - docker
    - backend
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/ssasukae/**/*
    - if: '$CI_COMMIT_BRANCH == "development" || $CI_COMMIT_BRANCH == "master"'
      changes:
        - backend/ssasukae/**/*
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  cache:
    key:
      files:
        - backend/ssasukae/gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/wrapper
      - .gradle/caches
  before_script:
    - cd backend/ssasukae
    - chmod +x ./gradlew
  script:
    - ./gradlew unitTest --console=plain --no-daemon --max-workers=1
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - backend/ssasukae/build/test-results/unitTest/TEST-*.xml
    paths:
      - backend/ssasukae/build/reports/tests

backend-deploy:
  stage: deploy
  image: docker:27
  tags:
    - docker
    - backend
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
      changes:
        - backend/ssasukae/**/*
        - .gitlab-ci.yml
  script:
    - cd backend/ssasukae
    - docker build -t ssasukae-backend .
    - docker rm -f backend || true
    - >
      docker run -d --name backend
      -p 8080:8080
      -e SPRING_PROFILES_ACTIVE=prod
      -e SPRING_DATASOURCE_URL="jdbc:mysql://${DB_HOST}:3306/ssasukae?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
      -e SPRING_DATASOURCE_USERNAME="${DB_USERNAME}"
      -e SPRING_DATASOURCE_PASSWORD="${DB_PASSWORD}"
      -e SPRING_DATA_REDIS_HOST="${DB_HOST}"
      -e SPRING_DATA_REDIS_PORT=6379
      -e SPRING_DATA_REDIS_PASSWORD="${REDIS_PASSWORD}"
      -e JWT_SECRET="${JWT_SECRET}"
      -e OPENVIDU_URL="${OPENVIDU_URL}"
      -e OPENVIDU_SECRET="${OPENVIDU_SECRET}"
      -e GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}"
      -e GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET}"
      -e KAKAO_CLIENT_ID="${KAKAO_CLIENT_ID}"
      -e KAKAO_CLIENT_SECRET="${KAKAO_CLIENT_SECRET}"
      --restart unless-stopped
      ssasukae-backend
    - docker image prune -f