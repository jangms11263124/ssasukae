[package]
name = "audio-gui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
audio-client = { path = "../audio-client" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# 브랜드 로고(PNG) 렌더링용. egui_extras 의 image 로더가 있어야 include_image! 가 동작한다.
egui_extras = { version = "0.31", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tungstenite.workspace = true
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm"] }
sha2 = "0.10"
windows.workspace = true
