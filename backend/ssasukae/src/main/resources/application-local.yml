spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ssasukae?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://localhost:5500

  cookie:
    secure: false

  oauth2:
    redirect-uri: http://localhost:3000/oauth/callback
    signup-redirect-uri: http://localhost:3000/signup
    failure-redirect-uri: http://localhost:3000/login-error
