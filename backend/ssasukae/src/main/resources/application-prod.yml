spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  jpa:
    # TODO: 정식 마이그레이션 도구(Flyway/Liquibase) 도입 전까지의 임시 설정.
    # 스키마가 안정화되면 validate로 바꾸는 걸 권장.
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    org.hibernate.SQL: off # logging.level.root를 debug로 올려도 SQL이 새지 않도록 명시적으로 차단

openvidu:
  url: ${OPENVIDU_URL}
  secret: ${OPENVIDU_SECRET}

app:
  cors:
    allowed-origins:
      - https://ssafystar-k.site

  cookie:
    secure: true

  oauth2:
    redirect-uri: https://ssafystar-k.site/oauth/callback
    signup-redirect-uri: https://ssafystar-k.site/signup
    failure-redirect-uri: https://ssafystar-k.site/login-error

management:
  server:
    port: 9292
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never