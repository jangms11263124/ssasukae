aws:
  s3:
    bucket: ssasukae-assets
    region: ap-northeast-2

spring:
  application:
    name: ssasukae

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

  profiles:
    default: local

  config:
    import: optional:application-secret.yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
            scope:
              - account_email
              - profile_nickname
              - profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  forward-headers-strategy: framework

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

ai:
  internal-api-key: ${AI_INTERNAL_API_KEY}
  upload-ticket-secret: ${AI_UPLOAD_TICKET_SECRET}
  upload-ticket-expiration-ms: 600000 # 10분

performance:
  recovery:
    performer-disconnect-grace: 15s
    analysis-timeout: 2m
    scan-delay: 1s
    batch-size: 100

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 600000      # 10분
  refresh-token-expiration: 604800000  # 7일
