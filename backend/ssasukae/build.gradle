plugins {
    id 'java'
    id 'com.diffplug.spotless' version '8.1.0'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ssafy'
version = '0.0.1-SNAPSHOT'
description = 'ssasukae'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'io.openvidu:openvidu-java-client:2.32.0'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        targetExclude(
                'src/main/java/com/ssafy/ssasukae/SsasukaeApplication.java',
                'src/main/java/com/ssafy/ssasukae/config/**/*.java',
                'src/main/java/com/ssafy/ssasukae/domain/auth/**/*.java',
                'src/main/java/com/ssafy/ssasukae/domain/user/**/*.java',
                'src/main/java/com/ssafy/ssasukae/global/exception/**/*.java',
                'src/main/java/com/ssafy/ssasukae/global/security/cookie/**/*.java',
                'src/main/java/com/ssafy/ssasukae/global/security/jwt/**/*.java',
                'src/main/java/com/ssafy/ssasukae/global/security/oauth/**/*.java'
        )
        googleJavaFormat('1.22.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        importOrder('java', 'javax', 'jakarta', 'org', 'com', '')
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('unitTest', Test) {
    description = 'Runs all tests except @SpringBootTest context-loading tests (no DB/Redis required).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    exclude '**/SsasukaeApplicationTests.class'
    exclude '**/*IntegrationTest.class'
}
